<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="swiper-bundle.css">
    <script src="swiper-bundle.js"></script>

    <script src="main.js" defer></script>
    <title>swiper</title>
</head>

<body>

    <!-- Slider main container -->
    <div class="swiper" style="height: 300px;">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide" style="border: 1px solid black; box-sizing: border-box;">내용 1</div>
            <div class="swiper-slide" style="border: 1px solid black; box-sizing: border-box;">내용 2</div>
            <div class="swiper-slide" style="border: 1px solid black; box-sizing: border-box;">내용 3</div>
            <div class="swiper-slide" style="border: 1px solid black; box-sizing: border-box;">내용 4</div>
            <div class="swiper-slide" style="border: 1px solid black; box-sizing: border-box;">내용 5</div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- If we need scrollbar -->
        <!-- <div class="swiper-scrollbar"></div> -->
    </div>


</body>

</html>
